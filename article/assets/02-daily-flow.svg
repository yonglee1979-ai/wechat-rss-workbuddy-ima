<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A2239" flood-opacity=".09"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#0E8F89"/></marker>
  </defs>
  <rect width="1400" height="820" fill="#F7F5F0"/>
  <text x="90" y="78" fill="#0A2239" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="700">每天自动同步时，脚本到底做了什么？</text>
  <text x="90" y="120" fill="#526273" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">一次运行 = 拉取 → 解析 → 去重 → 分批入库 → 记录结果</text>

  <g filter="url(#shadow)">
    <rect x="90" y="180" width="350" height="170" rx="24" fill="#FFFFFF"/>
    <rect x="525" y="180" width="350" height="170" rx="24" fill="#FFFFFF"/>
    <rect x="960" y="180" width="350" height="170" rx="24" fill="#FFFFFF"/>
    <rect x="90" y="450" width="350" height="170" rx="24" fill="#FFFFFF"/>
    <rect x="525" y="450" width="350" height="170" rx="24" fill="#FFFFFF"/>
    <rect x="960" y="450" width="350" height="170" rx="24" fill="#FFFFFF"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <g><circle cx="135" cy="230" r="28" fill="#FDE9E4"/><text x="135" y="239" text-anchor="middle" fill="#B64E3B" font-size="24" font-weight="700">1</text><text x="185" y="238" fill="#0A2239" font-size="24" font-weight="700">拉取合并 RSS</text><text x="125" y="287" fill="#526273" font-size="18">从 WeChatRSS 获取全部订阅</text><text x="125" y="318" fill="#526273" font-size="18">文章 URL、作者、标题、日期</text></g>
    <g><circle cx="570" cy="230" r="28" fill="#DFF4F1"/><text x="570" y="239" text-anchor="middle" fill="#0B6E69" font-size="24" font-weight="700">2</text><text x="620" y="238" fill="#0A2239" font-size="24" font-weight="700">解析文章条目</text><text x="560" y="287" fill="#526273" font-size="18">把 XML/RSS 变成结构化列表</text><text x="560" y="318" fill="#526273" font-size="18">空 feed 或 401 直接提示排查</text></g>
    <g><circle cx="1005" cy="230" r="28" fill="#FFF0D6"/><text x="1005" y="239" text-anchor="middle" fill="#A4650E" font-size="24" font-weight="700">3</text><text x="1055" y="238" fill="#0A2239" font-size="24" font-weight="700">按知识库去重</text><text x="995" y="287" fill="#526273" font-size="18">用每个知识库自己的 JSON</text><text x="995" y="318" fill="#526273" font-size="18">找出“feed URL − 已入库 URL”</text></g>
    <g><circle cx="135" cy="500" r="28" fill="#E5F3E9"/><text x="135" y="509" text-anchor="middle" fill="#287B4E" font-size="24" font-weight="700">4</text><text x="185" y="508" fill="#0A2239" font-size="24" font-weight="700">分批导入 IMA</text><text x="125" y="557" fill="#526273" font-size="18">调用 import_urls，每批最多 10 条</text><text x="125" y="588" fill="#526273" font-size="18">让 IMA 自动抓取文章全文</text></g>
    <g><circle cx="570" cy="500" r="28" fill="#E8E4F8"/><text x="570" y="509" text-anchor="middle" fill="#5C4E9B" font-size="24" font-weight="700">5</text><text x="620" y="508" fill="#0A2239" font-size="24" font-weight="700">只记录成功项</text><text x="560" y="557" fill="#526273" font-size="18">读取 code 与每条 ret_code</text><text x="560" y="588" fill="#526273" font-size="18">成功才写入去重文件，失败可重跑</text></g>
    <g><circle cx="1005" cy="500" r="28" fill="#FDE9E4"/><text x="1005" y="509" text-anchor="middle" fill="#B64E3B" font-size="24" font-weight="700">6</text><text x="1055" y="508" fill="#0A2239" font-size="24" font-weight="700">输出结果摘要</text><text x="995" y="557" fill="#526273" font-size="18">新增、跳过、失败各多少条</text><text x="995" y="588" fill="#526273" font-size="18">不打印 token、完整 URL 或正文</text></g>
  </g>
  <path d="M445 265H505" stroke="#0E8F89" stroke-width="6" marker-end="url(#arrow)"/><path d="M880 265H940" stroke="#0E8F89" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M1135 365V420" stroke="#0E8F89" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M940 535H880" stroke="#0E8F89" stroke-width="6" marker-end="url(#arrow)"/><path d="M505 535H445" stroke="#0E8F89" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M265 635 C265 710, 1125 730, 1125 635" fill="none" stroke="#8DBDB9" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <rect x="420" y="700" width="560" height="60" rx="30" fill="#0A2239"/>
  <text x="700" y="738" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700">没有新增文章？记录 0 条，然后安静结束。</text>
</svg>
