<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A2239" flood-opacity=".10"/></filter></defs>
  <rect width="1400" height="760" fill="#F7F5F0"/>
  <text x="90" y="78" fill="#0A2239" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="700">WorkBuddy 自动化任务怎么填？</text>
  <text x="90" y="120" fill="#526273" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">关键不是把 token 写进提示词，而是让任务在本地工作空间读取环境变量</text>
  <g filter="url(#shadow)"><rect x="90" y="175" width="590" height="490" rx="26" fill="#FFFFFF"/><rect x="735" y="175" width="575" height="490" rx="26" fill="#0A2239"/></g>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="135" y="230" fill="#0A2239" font-size="26" font-weight="700">左侧：任务配置</text>
    <text x="135" y="278" fill="#526273" font-size="17">名称</text><rect x="135" y="292" width="500" height="44" rx="10" fill="#F1F4F5"/><text x="155" y="320" fill="#0A2239" font-size="17">每日公众号文章 → IMA 知识库</text>
    <text x="135" y="370" fill="#526273" font-size="17">工作空间</text><rect x="135" y="384" width="500" height="44" rx="10" fill="#F1F4F5"/><text x="155" y="412" fill="#0A2239" font-size="17">选择脚本所在的本地文件夹</text>
    <text x="135" y="462" fill="#526273" font-size="17">定时规则</text><rect x="135" y="476" width="240" height="44" rx="10" fill="#DFF4F1"/><text x="155" y="504" fill="#0B6E69" font-size="17" font-weight="600">每天 · 08:30</text><rect x="390" y="476" width="245" height="44" rx="10" fill="#FFF0D6"/><text x="410" y="504" fill="#A4650E" font-size="17">先手动测试一次</text>
    <text x="135" y="570" fill="#526273" font-size="17">权限模式</text><rect x="135" y="584" width="500" height="44" rx="10" fill="#F1F4F5"/><text x="155" y="612" fill="#0A2239" font-size="17">允许访问脚本目录、网络和必要命令</text>

    <text x="780" y="230" fill="#FFFFFF" font-size="26" font-weight="700">右侧：建议提示词</text>
    <rect x="780" y="262" width="485" height="300" rx="16" fill="#12324B"/>
    <text x="810" y="302" fill="#9CC9C4" font-size="16">每天 08:30，在本地工作空间执行：</text>
    <text x="810" y="340" fill="#FFFFFF" font-size="16">1. 检查 python3、node 和脚本是否存在；</text>
    <text x="810" y="374" fill="#FFFFFF" font-size="16">2. 使用环境变量 WECHATRSS_TOKEN</text>
    <text x="810" y="408" fill="#FFFFFF" font-size="16">   拉取合并 RSS；</text>
    <text x="810" y="442" fill="#FFFFFF" font-size="16">3. 运行 python3 wechatrss_to_ima.py；</text>
    <text x="810" y="476" fill="#FFFFFF" font-size="16">4. 汇报新增 / 跳过 / 失败数量；</text>
    <text x="810" y="510" fill="#FFFFFF" font-size="16">5. 禁止输出任何 token、API key 或正文。</text>
    <rect x="780" y="594" width="485" height="40" rx="20" fill="#DFF4F1"/><text x="1022" y="620" text-anchor="middle" fill="#0B6E69" font-size="17" font-weight="700">本地模式优先：凭证与脚本都在本机</text>
  </g>
</svg>
