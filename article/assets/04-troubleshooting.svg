<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A2239" flood-opacity=".09"/></filter></defs>
  <rect width="1400" height="820" fill="#F7F5F0"/>
  <text x="90" y="78" fill="#0A2239" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="700">四个最容易卡住的点</text>
  <text x="90" y="120" fill="#526273" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">先看现象，再看是哪一层出了问题：供给、鉴权、ID，还是目录参数</text>
  <g filter="url(#shadow)"><rect x="90" y="175" width="570" height="230" rx="24" fill="#FFFFFF"/><rect x="740" y="175" width="570" height="230" rx="24" fill="#FFFFFF"/><rect x="90" y="455" width="570" height="230" rx="24" fill="#FFFFFF"/><rect x="740" y="455" width="570" height="230" rx="24" fill="#FFFFFF"/></g>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="90" y="175" width="10" height="230" rx="5" fill="#EE6C4D"/><text x="135" y="225" fill="#B64E3B" font-size="20" font-weight="700">Q1 · feed 是空的 / 返回 401</text><text x="135" y="270" fill="#0A2239" font-size="21" font-weight="700">先检查 token 与客户端同步</text><text x="135" y="312" fill="#526273" font-size="18">确认 token 未过期；确认微信客户端已扫码同步；</text><text x="135" y="345" fill="#526273" font-size="18">确认这些公众号确实在微信里被关注。</text><rect x="135" y="365" width="210" height="30" rx="15" fill="#FDE9E4"/><text x="240" y="386" text-anchor="middle" fill="#B64E3B" font-size="15" font-weight="600">定位：WeChatRSS 供给层</text>
    <rect x="740" y="175" width="10" height="230" rx="5" fill="#F2A93B"/><text x="785" y="225" fill="#A4650E" font-size="20" font-weight="700">Q2 · 220004 invalid</text><text x="785" y="270" fill="#0A2239" font-size="21" font-weight="700">你用的是移动端 ID</text><text x="785" y="312" fill="#526273" font-size="18">按知识库名称调用 search_knowledge_base，</text><text x="785" y="345" fill="#526273" font-size="18">改用返回的 OpenAPI kb_id。</text><rect x="785" y="365" width="210" height="30" rx="15" fill="#FFF0D6"/><text x="890" y="386" text-anchor="middle" fill="#A4650E" font-size="15" font-weight="600">定位：IMA ID 层</text>
    <rect x="90" y="455" width="10" height="230" rx="5" fill="#0E8F89"/><text x="135" y="505" fill="#0B6E69" font-size="20" font-weight="700">Q3 · 222000 文件夹不存在</text><text x="135" y="550" fill="#0A2239" font-size="21" font-weight="700">folder_id 传错了</text><text x="135" y="592" fill="#526273" font-size="18">按已验证脚本先省略 folder_id，让文章落根目录；</text><text x="135" y="625" fill="#526273" font-size="18">若当前 API 明确要求必填，再传根目录 ID。</text><rect x="135" y="645" width="210" height="30" rx="15" fill="#DFF4F1"/><text x="240" y="666" text-anchor="middle" fill="#0B6E69" font-size="15" font-weight="600">定位：IMA 目录层</text>
    <rect x="740" y="455" width="10" height="230" rx="5" fill="#5C4E9B"/><text x="785" y="505" fill="#5C4E9B" font-size="20" font-weight="700">Q4 · 任务跑了但没入库</text><text x="785" y="550" fill="#0A2239" font-size="21" font-weight="700">先看脚本输出，再看成功码</text><text x="785" y="592" fill="#526273" font-size="18">检查 IMA code 与每条 ret_code；失败项不要写入去重，</text><text x="785" y="625" fill="#526273" font-size="18">否则下一次无法重试。</text><rect x="785" y="645" width="210" height="30" rx="15" fill="#E8E4F8"/><text x="890" y="666" text-anchor="middle" fill="#5C4E9B" font-size="15" font-weight="600">定位：执行与状态层</text>
  </g>
</svg>
